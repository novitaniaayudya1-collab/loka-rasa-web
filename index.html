  <!-- SCRIPT SLIDER -->
  <script>
    let currentSlide = 0;
    const slidesContainer = document.getElementById('slidesContainer');
    const dots = document.querySelectorAll('.dot');
    const totalSlides = 3;
    let autoSlideInterval;

    function updateSlide() {
      slidesContainer.style.transform = `translateX(-${currentSlide * 100}%)`;
      dots.forEach((dot, index) => {
        dot.classList.toggle('active', index === currentSlide);
      });
    }

    function nextSlide() {
      currentSlide = (currentSlide + 1) % totalSlides;
      updateSlide();
      resetTimer();
    }

    function prevSlide() {
      currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
      updateSlide();
      resetTimer();
    }

    function goToSlide(index) {
      currentSlide = index;
      updateSlide();
      resetTimer();
    }

    function startTimer() {
      autoSlideInterval = setInterval(() => {
        currentSlide = (currentSlide + 1) % totalSlides;
        updateSlide();
      }, 2500);
    }

    function resetTimer() {
      clearInterval(autoSlideInterval);
      startTimer();
    }

    startTimer();
  </script>
  <!-- SCRIPT TESTIMONI FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // GANTI DENGAN CONFIG FIREBASE KAMU
    const firebaseConfig = {
  apiKey: "AIzaSyBPIkX4BkFn5HuD5SBp2drar7G14oxLu80",
  authDomain: "loka-rasa-bebdf.firebaseapp.com",
  projectId: "loka-rasa-bebdf",
  storageBucket: "loka-rasa-bebdf.firebasestorage.app",
  messagingSenderId: "920017366471",
  appId: "1:920017366471:web:9f3a0a250777b70a973de2"
};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadTestimoni() {
      const container = document.getElementById('testimoniContainer');
      if(!container) return;
      container.innerHTML = '';
      
      try {
        const q = query(collection(db, "testimonials"), orderBy("createdAt", "desc"));
        const querySnapshot = await getDocs(q);

        querySnapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const id = docSnap.id;
          let stars = '★'.repeat(data.rating || 5);
          
          container.innerHTML += `
            <div class="testimonial-card" style="position: relative;">
              <button onclick="hapusTestimoni('${id}')" style="position: absolute; top: 10px; right: 10px; background: #ff4d4d; color: white; border: none; border-radius: 4px; padding: 2px 6px; font-size: 11px; cursor: pointer;">Hapus</button>
              <div>
                <div class="stars">${stars}</div>
                <p class="testimonial-text">"${data.pesan}"</p>
              </div>
              <div class="testimonial-author">- ${data.nama}</div>
            </div>
          `;
        });
      } catch (e) {
        console.error("Error loading testimoni: ", e);
      }
    }

    window.tambahTestimoni = async function() {
      const nama = document.getElementById('nama').value;
      const rating = parseInt(document.getElementById('rating').value);
      const pesan = document.getElementById('pesan').value;

      if(!nama || !pesan) {
        alert('Isi nama dan testimoni dulu ya!');
        return;
      }

      try {
        await addDoc(collection(db, "testimonials"), {
          nama: nama,
          rating: rating,
          pesan: pesan,
          createdAt: new Date()
        });

        document.getElementById('nama').value = '';
        document.getElementById('pesan').value = '';
        loadTestimoni();
        alert('Testimoni berhasil dikirim!');
      } catch (e) {
        console.error("Error adding document: ", e);
        alert('Gagal mengirim testimoni. Cek koneksi/rules Firebase kamu.');
      }
    };

    window.hapusTestimoni = async function(id) {
      if(confirm("Yakin mau hapus testimoni ini?")) {
        try {
          await deleteDoc(doc(db, "testimonials", id));
          loadTestimoni();
        } catch (e) {
          console.error("Error deleting document: ", e);
        }
      }
    };

    loadTestimoni();
  </script>
